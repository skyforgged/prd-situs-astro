name: Validator Tests

on:
  push:
  pull_request:

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Smoke-test validator CLI
        run: python scripts/validate_content.py --help
      - name: Run validator unit and CLI integration tests
        run: pytest -q
