version: 1
collections:
  training:
    directory: trainings
    requiredFields: [id, slug, title, schema, updatedDate]
    fieldTypes:
      id: positive_int
      slug: string
      title: string
      schema: object
      updatedDate: utc_datetime
      scheduleIds: positive_int_array
    schemaTypes: [Course]
    schemaMappings:
      Course:
        fieldMapping:
          name: title
          description: description
        requiredFields: [title, description]
    routePrefix: /training/
    relations:
      scheduleIds:
        target: schedule
        cardinality: many
  schedule:
    directory: schedules
    requiredFields: [id, slug, title, schema, updatedDate, startDate, endDate]
    fieldTypes:
      id: positive_int
      slug: string
      title: string
      schema: object
      updatedDate: utc_datetime
      startDate: string
      endDate: string
    schemaTypes: [Event]
    schemaMappings:
      Event:
        fieldMapping:
          name: title
          startDate: startDate
          endDate: endDate
        requiredFields: [title, startDate, endDate]
    routePrefix: /schedule/
