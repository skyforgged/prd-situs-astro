version: 1
collections:
  training:
    directory: trainings
    requiredFields: [id, ulid, type, trainingSlug, slug, title, description, pubDate, updatedDate]
    fieldTypes:
      id: positive_int
      ulid: ulid
      type: string
      trainingSlug: string
      slug: string
      title: string
      description: string
      categoryIds: positive_int_array
      pubDate: offset_datetime
      updatedDate: offset_datetime
      draft: boolean
      image: string
      hero: object
      blocks: array
      trainingId: positive_int
    fieldEnums:
      type: [training]
    schemaTypes: [Course]
    schemaType: Course
    schemaMappings:
      Course:
        fieldMapping:
          name: title
          description: description
        requiredFields: [title, description]
    routePrefix: /training/

  schedule:
    directory: schedules
    requiredFields: [id, ulid, type, scheduleId, publisherId, trainingSlug, batchNo, slug, title, description, startDate, endDate, dateLabel, timezone, pubDate, updatedDate, status]
    fieldTypes:
      id: positive_int
      ulid: ulid
      type: string
      scheduleId: string
      publisherId: string
      trainingSlug: string
      batchNo: string
      slug: string
      title: string
      description: string
      startDate: iso_date_or_datetime
      endDate: iso_date_or_datetime
      dateLabel: string
      timezone: string
      pubDate: offset_datetime
      updatedDate: offset_datetime
      status: string
      registration: object
      delivery: object
      venue: object
      completion: object
      sites: object
    fieldEnums:
      type: [schedule]
      status: [scheduled, ongoing, completed, postponed, cancelled]
    schemaTypes: [Event]
    schemaType: Event
    schemaMappings:
      Event:
        fieldMapping:
          name: title
          startDate: startDate
          endDate: endDate
        requiredFields: [title, startDate, endDate]
    routePrefix: /schedule/
    relations:
      trainingSlug:
        target: training
        targetField: trainingSlug
        cardinality: one
